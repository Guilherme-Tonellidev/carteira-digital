server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # Repassa /api/... para o back-end (o prefixo /api é removido), igual ao proxy do Vite em desenvolvimento.
    # O endereço é resolvido a cada requisição, então o nginx sobe mesmo que o back-end ainda esteja iniciando.
    location /api/ {
        resolver 127.0.0.11 valid=10s;
        set $backend http://backend:8080;
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Arquivos com hash no nome podem ficar em cache por muito tempo.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Qualquer outra rota cai no index.html (aplicação de página única).
    location / {
        try_files $uri $uri/ /index.html;
    }
}
